<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太空拖船 · 模块回收</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #05070f;
      color: #cfe3ff;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      background: rgba(8, 14, 30, 0.72);
      border: 1px solid rgba(110, 170, 255, 0.35);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.65;
      min-width: 230px;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    .hud h1 {
      margin: 0 0 6px;
      font-size: 15px;
      letter-spacing: 2px;
      color: #8fd0ff;
    }
    .bar {
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      margin: 2px 0 6px;
    }
    .bar > span {
      display: block;
      height: 100%;
      transition: width 0.1s linear;
    }
    .fuel > span { background: linear-gradient(90deg, #37e08b, #b6ff6b); }
    .hull > span { background: linear-gradient(90deg, #ff7a5c, #ffd166); }
    .controls {
      position: fixed;
      bottom: 14px;
      left: 14px;
      background: rgba(8, 14, 30, 0.72);
      border: 1px solid rgba(110, 170, 255, 0.25);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.7;
      max-width: 360px;
      backdrop-filter: blur(4px);
    }
    .controls b { color: #8fd0ff; }
    .buttons {
      position: fixed;
      top: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background: rgba(30, 60, 110, 0.85);
      color: #dcecff;
      border: 1px solid rgba(140, 190, 255, 0.4);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: rgba(50, 95, 165, 0.9); }
    #banner {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(3, 6, 14, 0.7);
      text-align: center;
    }
    #banner h2 {
      font-size: 42px;
      margin: 0 0 10px;
      letter-spacing: 4px;
    }
    #banner p { font-size: 15px; color: #9fc2ee; }
    .tag { color: #ffd166; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <h1>太空拖船 TUG-7</h1>
    <div>种子 SEED: <span id="seed">-</span></div>
    <div>时间: <span id="time">0.0</span> s</div>
    <div>回收: <span id="recovered">0/3</span></div>
    <div>燃料
      <div class="bar fuel"><span id="fuelBar" style="width:100%"></span></div>
    </div>
    <div>船体
      <div class="bar hull"><span id="hullBar" style="width:100%"></span></div>
    </div>
    <div>缆绳张力: <span id="tension">0</span> N</div>
    <div>绳长: <span id="cableLen">0</span> m</div>
    <div>拖带等效质量: <span id="effMass">0</span> kg</div>
    <div>速度: <span id="speed">0</span> m/s</div>
    <div>状态: <span id="status" class="tag">运行中</span></div>
  </div>

  <div class="controls">
    <div><b>W / ↑</b> 主推进器　<b>S / ↓</b> 制动反推</div>
    <div><b>A D / ← →</b> RCS 转向　<b>Q</b> 收缆　<b>E</b> 放缆</div>
    <div><b>空格</b> 挂接/脱开缆绳　<b>R</b> 重开同种子　<b>M</b> 静音</div>
    <div>把三个漂浮模块依次拖回空间站对接圈；燃料耗尽或船体损毁即失败。</div>
  </div>

  <div class="buttons">
    <button id="btnAuto">自动演示 (固定种子通关)</button>
    <button id="btnOverload">过载失控测试</button>
    <button id="btnRestart">重新开始 (R)</button>
    <button id="btnMute">声音: 开 (M)</button>
  </div>

  <div id="banner">
    <h2 id="bannerTitle"></h2>
    <p id="bannerText"></p>
  </div>

  <script src="src/physics.js"></script>
  <script src="src/autopilot.js"></script>
  <script src="src/game.js"></script>
</body>
</html>

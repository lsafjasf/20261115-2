<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>中英混排自动排版引擎 · Canvas 预览</title>
    <style>
      body {
        margin: 0;
        font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
        display: grid;
        grid-template-columns: 340px 1fr;
        min-height: 100vh;
        color: #222;
      }
      aside {
        background: #f5f7fb;
        border-right: 1px solid #dde3ee;
        padding: 18px;
        overflow-y: auto;
      }
      h1 { font-size: 17px; margin: 0 0 12px; }
      h2 { font-size: 13px; margin: 18px 0 6px; color: #555; }
      textarea {
        width: 100%;
        height: 220px;
        box-sizing: border-box;
        font: 12px/1.5 monospace;
        padding: 8px;
        border: 1px solid #c7d0e0;
        border-radius: 6px;
        resize: vertical;
      }
      button {
        margin: 4px 4px 4px 0;
        padding: 7px 12px;
        border: 1px solid #5b7bb4;
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      button.primary { background: #4169b0; color: #fff; }
      button:disabled { opacity: 0.45; cursor: default; }
      label { font-size: 12px; display: block; margin: 6px 0; }
      select, input[type="number"] {
        width: 80px;
        padding: 4px;
        border: 1px solid #c7d0e0;
        border-radius: 4px;
      }
      #diag {
        font: 11px/1.5 ui-monospace, monospace;
        background: #fff;
        border: 1px solid #dde3ee;
        border-radius: 6px;
        padding: 8px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .ok { color: #1c7c4d; }
      .warn { color: #b3541e; }
      main { padding: 24px; overflow: auto; background: #e9edf5; }
      canvas {
        background: #fff;
        box-shadow: 0 4px 18px rgba(20, 40, 80, 0.18);
        display: block;
      }
      .hint { font-size: 11px; color: #777; margin-top: 4px; }
      .pill { display:inline-block; padding:1px 7px; border-radius:10px; background:#e3e9f5; font-size:11px; }
    </style>
  </head>
  <body>
    <aside>
      <h1>自动排版引擎 <span class="pill">Canvas 测量 / 预览</span></h1>

      <h2>文稿（空行分段）</h2>
      <textarea id="source"></textarea>

      <h2>页面</h2>
      <label>栏数
        <select id="columns">
          <option>2</option><option selected>3</option><option>4</option>
        </select>
        字号 <input id="fontSize" type="number" value="15" min="10" max="24" />
      </label>

      <h2>操作</h2>
      <button class="primary" id="relayout">重新排版</button>
      <button id="toggleShape">移动图形</button>
      <button id="unpin" disabled>取消固定</button>
      <button id="exportSvg">导出 SVG</button>
      <button id="exportPng">导出 PNG</button>
      <div class="hint">点击预览中的任意段落即可固定/取消固定；固定段以橙色虚线框标注，重排时保持不动。</div>

      <h2>诊断（行首尾禁则 / 孤行 / 超框）</h2>
      <div id="diag"></div>
    </aside>
    <main>
      <canvas id="view" width="600" height="800"></canvas>
    </main>

      <script src="src/tokenizer.js"></script>
      <script src="src/measurer.js"></script>
      <script src="src/geometry.js"></script>
      <script src="src/linebreaker.js"></script>
      <script src="src/layout.js"></script>
      <script src="src/render.js"></script>
      <script src="src/browser-app.js"></script>
  </body>
</html>

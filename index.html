<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>字幕工作台 · 新闻 / 剧情 / 提示卡</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>字幕工作台</h1>
    <div class="exports">
      <button id="export-frame" type="button">导出当前帧 PNG</button>
      <button id="export-json" type="button" class="primary">导出模板 JSON</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage-panel">
      <div class="canvas-wrap">
        <canvas id="stage" width="1280" height="720"></canvas>
      </div>

      <div class="transport">
        <button id="play-pause" type="button" class="primary">▶ 播放</button>
        <button id="stop" type="button">■ 停止</button>
        <input id="scrubber" type="range" min="0" max="15" step="0.01" value="0">
        <span id="timecode" class="timecode">00:00.00 / 00:15.00</span>
      </div>

      <div class="timeline" id="timeline"></div>
      <p class="hint">点击时间轴轨道可跳转；拖动滑块同样会让动画与节目时间轴保持同步。</p>
    </section>

    <aside class="editor">
      <h2>字幕条目</h2>
      <ul id="cue-list" class="cue-list"></ul>
      <button id="add-cue" type="button" class="wide">＋ 新建字幕</button>

      <h2>模板（切换不丢文本）</h2>
      <div id="template-switch" class="template-switch"></div>
      <p id="template-pace" class="pace"></p>

      <h2>字幕内容</h2>
      <textarea id="text-input" rows="3" placeholder="输入字幕文字…"></textarea>

      <h2>样式调整</h2>
      <label class="field">
        字号 <span class="value" id="font-size-value"></span>
        <input id="font-size" type="range" min="20" max="96" step="1">
      </label>

      <div class="check-field">
        <label><input id="box-enabled" type="checkbox"> 背景框</label>
        <input id="box-color" type="color">
      </div>
      <label class="field compact">
        圆角 <span class="value" id="box-radius-value"></span>
        <input id="box-radius" type="range" min="0" max="32" step="1">
      </label>

      <div class="check-field">
        <label><input id="stroke-enabled" type="checkbox"> 描边</label>
        <input id="stroke-color" type="color">
      </div>
      <label class="field compact">
        描边宽度 <span class="value" id="stroke-width-value"></span>
        <input id="stroke-width" type="range" min="0" max="12" step="1">
      </label>

      <h2>入场方式</h2>
      <select id="entrance-select"></select>

      <h2>时间区间（秒）</h2>
      <div class="time-range">
        <label>起点 <input id="cue-start" type="number" min="0" max="15" step="0.1"></label>
        <label>终点 <input id="cue-end" type="number" min="0" max="15" step="0.1"></label>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水库泄洪调度模拟器</title>
<style>
  :root {
    --bg: #0e1621; --panel: #16222f; --line: #2a3b4d;
    --text: #d8e4ee; --dim: #7d93a8;
    --inflow: #4da3ff; --outflow: #ffb84d; --level: #4dd0a6; --danger: #ff5d5d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 "PingFang SC", "Microsoft YaHei", sans-serif; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--dim); margin-bottom: 14px; }
  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 14px; max-width: 1280px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .panel h2 { font-size: 14px; color: var(--dim); margin-bottom: 8px; font-weight: 600; }
  canvas { width: 100%; display: block; border-radius: 6px; background: #0b121b; }
  .charts { display: grid; gap: 14px; }
  .side { display: grid; gap: 14px; align-content: start; }
  .stat { display: flex; justify-content: space-between; padding: 3px 0; }
  .stat b { font-variant-numeric: tabular-nums; }
  .warn { color: var(--danger); }
  #alertBox { display: none; background: #3a1520; border: 1px solid var(--danger); color: #ffb3b3;
    border-radius: 8px; padding: 10px 12px; font-weight: 600; }
  #alertBox.show { display: block; animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: .55; } }
  input[type=range] { width: 100%; accent-color: var(--outflow); }
  .gateVal { font-size: 26px; font-weight: 700; color: var(--outflow); text-align: center; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button { background: #23405c; color: var(--text); border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #2d527a; }
  button:disabled { opacity: .4; cursor: default; }
  #logList { max-height: 170px; overflow-y: auto; font-size: 12px; font-family: ui-monospace, monospace; }
  #logList div { padding: 2px 0; border-bottom: 1px dashed var(--line); }
  .hint { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div class="layout">
  <div class="charts">
    <h1>水库泄洪调度模拟器</h1>
    <p class="sub">24 小时洪水过程 · 每 15 分钟更新 · 闸门操作延迟 30 分钟生效</p>
    <div id="alertBox"></div>
    <div class="panel"><h2>坝体剖面与实时水情</h2><canvas id="damCanvas" height="240"></canvas></div>
    <div class="panel"><h2>入库流量 (m³/s)</h2><canvas id="inflowCanvas" height="150"></canvas></div>
    <div class="panel"><h2>出库流量 (m³/s)　<span class="warn">— 下游上限 1200</span></h2><canvas id="outflowCanvas" height="150"></canvas></div>
    <div class="panel"><h2>库水位 (m)　<span class="warn">— 警戒水位 155.0</span></h2><canvas id="levelCanvas" height="150"></canvas></div>
  </div>
  <div class="side">
    <div class="panel">
      <h2>当前状态 <span id="clock" style="float:right"></span></h2>
      <div class="stat"><span>库水位</span><b id="stLevel">—</b></div>
      <div class="stat"><span>入库流量</span><b id="stIn">—</b></div>
      <div class="stat"><span>出库流量</span><b id="stOut">—</b></div>
      <div class="stat"><span>生效开度</span><b id="stGate">—</b></div>
      <div class="stat"><span>待生效开度</span><b id="stPend">—</b></div>
    </div>
    <div class="panel">
      <h2>闸门开度控制</h2>
      <div class="gateVal" id="gateVal">15%</div>
      <input type="range" id="gateSlider" min="0" max="100" value="15">
      <p class="hint">拖动后立即记录，30 分钟后作用于出库。</p>
    </div>
    <div class="panel">
      <h2>调度台</h2>
      <div class="btns">
        <button id="btnPlay">▶ 开始</button>
        <button id="btnStep">单步 +15min</button>
        <button id="btnReset">↺ 恢复初始</button>
        <button id="btnReplay">⏵ 回放调度</button>
        <button id="btnExport">⬇ 导出记录</button>
        <button id="btnSound">🔇 水声关</button>
      </div>
    </div>
    <div class="panel">
      <h2>调节记录</h2>
      <div id="logList"><div class="hint">暂无操作</div></div>
    </div>
  </div>
</div>
<script src="sim.js"></script>
<script src="app.js"></script>
</body>
</html>

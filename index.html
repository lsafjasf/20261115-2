<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>净化塔调度模拟</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #10151c; color: #dfe7ef;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center; padding: 16px;
  }
  #app { display: flex; gap: 16px; }
  #left { position: relative; }
  canvas { display: block; background: #18202b; border-radius: 8px; }
  #banner {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(10, 14, 20, 0.75); border-radius: 8px;
    font-size: 28px; font-weight: 700; text-align: center;
  }
  #banner small { font-size: 14px; font-weight: 400; margin-top: 8px; }
  #panel { width: 300px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: #1b2532; border: 1px solid #2b3a4d;
    border-radius: 8px; padding: 10px 12px;
  }
  .card h3 { font-size: 14px; margin-bottom: 6px; color: #8fd0ff; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
  .row label { width: 56px; color: #9fb2c5; }
  .row output { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: #4da3ff; }
  button {
    background: #2b3a4d; color: #dfe7ef; border: 1px solid #3d5470;
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #36495f; }
  .filters { display: flex; gap: 6px; margin-top: 6px; }
  .filter {
    flex: 1; height: 10px; border-radius: 5px;
    background: #24303f; position: relative; overflow: hidden;
  }
  .filter > i {
    position: absolute; inset: 0; width: 0%;
    background: #58c472; display: block;
  }
  .filter.active { outline: 2px solid #4da3ff; }
  .filter.over > i { background: #e05555; }
  .mon { display: flex; justify-content: space-between; font-size: 13px; margin: 4px 0; }
  .mon b { font-variant-numeric: tabular-nums; }
  .ok { color: #6fe08f; } .bad { color: #ff7a7a; }
  #hud { display: flex; gap: 10px; align-items: center; }
  #hud .card { flex: 1; text-align: center; }
  #timer { font-size: 20px; font-variant-numeric: tabular-nums; }
  .warn { color: #ffb347; font-size: 12px; min-height: 14px; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <canvas id="cv" width="1000" height="600"></canvas>
    <div id="banner"></div>
  </div>
  <div id="panel">
    <div id="hud">
      <div class="card"><div id="timer">00:00</div><small>剩余时间</small></div>
      <div class="card"><div id="hold">0 / 60s</div><small>全达标保持</small></div>
    </div>
    <div class="card">
      <h3>监测点（限值 75）</h3>
      <div id="monitors"></div>
    </div>
    <div id="towers"></div>
    <div class="card">
      <div class="row">
        <button id="pauseBtn">暂停</button>
        <button id="restartBtn">重新开局</button>
        <button id="audioBtn">开启声音</button>
      </div>
      <div class="warn" id="warn"></div>
    </div>
  </div>
</div>
<script src="sim.js"></script>
<script src="ui.js"></script>
</body>
</html>

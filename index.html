<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宽幅分切机仿真</title>
  <style>
    :root {
      --bg: #0b101b;
      --panel: #161f30;
      --line: #26334d;
      --text: #dfe7f3;
      --muted: #8ea0bd;
      --accent: #4f8cff;
      --ok: #34d99a;
      --warn: #ffd34d;
      --danger: #ff4d5e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .layout {
      display: grid;
      grid-template-columns: 980px 320px;
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
    }
    canvas {
      width: 960px;
      height: 520px;
      border-radius: 8px;
      display: block;
      cursor: crosshair;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 18px;
      margin-top: 12px;
    }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
    input[type="range"] { width: 100%; }
    .readout { font-family: monospace; color: var(--text); }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 7px;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary { background: #33415c; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
    .bar { height: 7px; background: #22304a; border-radius: 4px; overflow: hidden; margin-top: 3px; }
    .bar > div { height: 100%; background: var(--accent); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #22304a;
    }
    .badge.ok { background: rgba(52,217,154,0.18); color: var(--ok); }
    .badge.warn { background: rgba(255,211,77,0.18); color: var(--warn); }
    .badge.danger { background: rgba(255,77,94,0.2); color: var(--danger); }
    #log {
      height: 150px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      background: #0d1422;
      border-radius: 8px;
      padding: 8px;
      margin-top: 10px;
    }
    #log .danger { color: var(--danger); }
    #log .success { color: var(--ok); }
    #log .warn { color: var(--warn); }
    .knife-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
    .knife-grid input {
      width: 100%;
      background: #0d1422;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 6px;
      font-family: monospace;
    }
    .stat { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
    .stat b { font-family: monospace; }
  </style>
</head>
<body>
  <h1>宽幅纸卷分切仿真 — 对刀 · 卷速 · 张力</h1>
  <div class="layout">
    <div>
      <div class="panel">
        <canvas id="scene" width="960" height="520"></canvas>
        <div class="controls">
          <div>
            <label>卷速 <span class="readout" id="speedVal">0</span> m/min（额定 200，最大 300）</label>
            <input type="range" id="speed" min="0" max="300" value="0">
          </div>
          <div>
            <label>张力 <span class="readout" id="tensionVal">55</span>（安全区 42–68，≥82 有断纸风险）</label>
            <input type="range" id="tension" min="0" max="100" value="55">
          </div>
        </div>
        <div class="btn-row">
          <button id="startBtn">▶ 开机</button>
          <button id="stopBtn" class="secondary">■ 停机</button>
          <button id="alignBtn" class="secondary">自动对刀</button>
          <button id="resetBtn" class="secondary">复位</button>
        </div>
      </div>
      <div class="panel" style="margin-top:14px">
        <strong style="font-size:13px">刀位调整（mm，停机时可拖动画布上的刀或直接输入；5 刀形成 4 条订单带）</strong>
        <div class="knife-grid" id="knifeInputs"></div>
        <div id="log"></div>
      </div>
    </div>
    <div>
      <div class="panel">
        <div class="stat"><span>设备状态</span><span class="badge" id="statusBadge">就绪</span></div>
        <div class="stat"><span>对刀</span><span class="badge" id="alignBadge">未对刀</span></div>
        <div class="stat"><span>废边率</span><b id="wasteVal">0.00%</b></div>
        <div class="stat"><span>废边目标</span><b>≤ 12%</b></div>
        <div class="stat"><span>走纸长度</span><b id="processedVal">0 m</b></div>
        <div class="stat"><span>仿真时间</span><b id="timeVal">0 s</b></div>
      </div>
      <div class="panel" style="margin-top:14px">
        <strong style="font-size:13px">订单进度（长度须精确）</strong>
        <table>
          <thead><tr><th>规格</th><th>宽度</th><th>进度</th></tr></thead>
          <tbody id="orderBody"></tbody>
        </table>
      </div>
      <div class="panel" style="margin-top:14px">
        <strong style="font-size:13px">玩法</strong>
        <p style="font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0 0">
          1. 调整 5 把分切刀，使 4 条带宽等于订单宽度，两侧各留 110mm 废边。<br>
          2. 张力保持在安全区；张力过低纸幅偏移大、边缘报废，过高会断纸。<br>
          3. 卷速越高产量越快但偏移和风险越大。<br>
          4. 四种订单长度精确完成且废边率 ≤12% 即成功。
        </p>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>

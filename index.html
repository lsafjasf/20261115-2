<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光伏板沙尘清洁模拟</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>光伏板沙尘清洁模拟</h1>
    <div class="hud">
      <span id="hud-time">时间 0.0s</span>
      <span id="hud-water">用水 0.00L</span>
      <span id="hud-tank">水箱 2.00L</span>
      <span id="hud-power">发电 25%</span>
      <span id="hud-wind">风 3.0m/s</span>
      <span id="hud-result" class="result-idle">待运行</span>
    </div>
  </header>

  <main class="layout">
    <section class="stage">
      <canvas id="scene" width="960" height="360"></canvas>
      <canvas id="chart" width="960" height="180"></canvas>
    </section>

    <aside class="panel controls">
      <h2>运行参数</h2>
      <label class="control">
        <span>行走速度 <b id="val-speed">1.2 m/s</b></span>
        <input id="in-speed" type="range" min="0.4" max="2.5" step="0.1" value="1.2">
      </label>
      <label class="control">
        <span>刷轮压力 <b id="val-pressure">60 N</b></span>
        <input id="in-pressure" type="range" min="20" max="100" step="5" value="60">
      </label>
      <label class="control">
        <span>喷水流量 <b id="val-flow">3.0 L/min</b></span>
        <input id="in-flow" type="range" min="0" max="5" step="0.1" value="3.0">
      </label>

      <div class="buttons">
        <button id="btn-start" class="primary">开始清洁</button>
        <button id="btn-pause">暂停</button>
        <button id="btn-reset">复位</button>
        <button id="btn-sound">声音:开</button>
      </div>

      <h2>目标板恢复率（≥90%）</h2>
      <div id="target-list" class="targets"></div>

      <h2>预设方案</h2>
      <div class="presets">
        <button data-preset="balanced">平衡默认</button>
        <button data-preset="saver">慢速节水</button>
        <button data-preset="greedy">大流量</button>
        <button data-preset="dry">快洗少水</button>
      </div>
      <p class="hint">提示：水在返程前耗尽会使起点侧目标板欠清洗；阵风会把水雾吹到相邻板。</p>
    </aside>
  </main>

  <script src="js/simulation.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

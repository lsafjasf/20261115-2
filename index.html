<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>地下泵房双人排水</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: #050914;
      color: #e2e8f0;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 { font-size: 20px; margin: 4px 0 0; }
    .hint { color: #94a3b8; font-size: 13px; max-width: 960px; text-align: center; }
    canvas {
      width: min(960px, 96vw);
      height: auto;
      border: 1px solid #1e293b;
      border-radius: 12px;
      background: #0b1220;
    }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button {
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #334155; }
    button.primary { background: #0369a1; border-color: #0284c7; }
    kbd {
      background: #0f172a;
      border: 1px solid #334155;
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 1px 7px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <h1>地下泵房 · 双人协同排水（10 分钟模拟）</h1>
  <div class="hint">
    玩家1 负责摇杆节奏：<kbd>Space</kbd>，超过 1.2 次/秒会快速过热；
    玩家2 负责阀门方向：<kbd>A</kbd> / <kbd>B</kbd>，满池继续送水会回灌。
    目标：把泵房水位从 100 降到 35 安全线。
  </div>
  <canvas id="game" width="960" height="600" aria-label="泵房排水模拟画面"></canvas>
  <div class="controls">
    <button id="startBtn" class="primary">开始模拟</button>
    <button id="crankBtn">摇泵（Space）</button>
    <button id="valveABtn">阀门 A</button>
    <button id="valveBBtn">阀门 B</button>
    <button id="resetBtn">重新开始</button>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>

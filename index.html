<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贴标机调机模拟 · 十二瓶合格挑战</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: #10161f;
      color: #e8eef6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px;
    }
    .app { width: 1020px; max-width: 100%; }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    h1 { font-size: 20px; margin: 0; letter-spacing: 1px; }
    .hud { display: flex; gap: 14px; font-size: 13px; color: #9fb2c8; }
    .hud b { color: #ffd166; font-size: 15px; }
    .hud .fail b { color: #ef6f6c; }
    #stage {
      position: relative;
      background: #16202d;
      border: 1px solid #2a3a4f;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: auto; }
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background: rgba(10, 16, 24, 0.72);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .overlay.show { display: flex; }
    .overlay small { font-size: 14px; font-weight: 400; color: #b9c8da; letter-spacing: 0; }
    .panel {
      margin-top: 12px;
      background: #16202d;
      border: 1px solid #2a3a4f;
      border-radius: 12px;
      padding: 14px 16px;
    }
    .sliders {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 14px;
    }
    .slider-head {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      color: #c3d1e1;
    }
    .slider-head .val { color: #6ec6ff; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: #4dabf7; }
    .tolerance { font-size: 11px; color: #7f93ab; margin-top: 4px; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #0e1620;
      background: #4dabf7;
    }
    button.secondary { background: #3a4d63; color: #e8eef6; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .slots { display: flex; gap: 7px; margin-left: auto; }
    .slot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #263445;
      border: 1px solid #3a4d63;
      position: relative;
    }
    .slot.pass { background: #38d39f; border-color: #38d39f; }
    .slot.fail { background: #ef6f6c; border-color: #ef6f6c; }
    .log {
      margin-top: 10px;
      font-size: 12px;
      color: #9fb2c8;
      min-height: 18px;
    }
    .log .bad { color: #ef6f6c; }
    .log .good { color: #38d39f; }
    footer { margin-top: 10px; font-size: 12px; color: #6f8299; line-height: 1.7; }
    kbd {
      background: #263445;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>饮料瓶贴标机 · 调机模拟</h1>
      <div class="hud">
        <span>合格 <b id="passCount">0</b>/12</span>
        <span class="fail">不合格 <b id="failCount">0</b></span>
        <span id="runState">运行中</span>
      </div>
    </header>

    <div id="stage">
      <canvas id="canvas" width="1000" height="430"></canvas>
      <div class="overlay" id="overlay">
        <div id="overlayTitle">十二瓶合格，调机完成</div>
        <small id="overlaySub">标签全部落在允许区域内</small>
      </div>
    </div>

    <div class="panel">
      <div class="sliders" id="sliders"></div>
      <div class="actions">
        <button id="pauseBtn">暂停</button>
        <button id="resetBtn" class="secondary">重置</button>
        <button id="muteBtn" class="secondary">静音</button>
        <div class="slots" id="slots"></div>
      </div>
      <div class="log" id="log">调整转速、胶水量与压轮角度，让经过检查线的 12 瓶标签全部落在允许区域。</div>
    </div>

    <footer>
      判定规则：胶水量 30–70%（少了翘边、多了拉丝）；转速 68–92 rpm（失配会扭转标签并卷入气泡）；压轮角度 ±5°（超限偏移并压入气泡）。
      快捷键：<kbd>空格</kbd> 暂停/继续，<kbd>R</kbd> 重置，<kbd>M</kbd> 静音。
    </footer>
  </div>

  <script src="labeling-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
